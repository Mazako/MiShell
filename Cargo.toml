[package]
name = "codecrafters-shell"
version = "0.1.0"
authors = ["Codecrafters <hello@codecrafters.io>"]
edition = "2024"
rust-version = "1.95"

[dependencies]
anyhow = "1.0.68"                                         # error handling
bytes = "1.3.0"                                           # helps manage buffers
indexmap = "2.14.0"
pest = "2.8.6"
pest_derive = "2.8.6"
regex = "1.12.3"
rustyline = { version = "18.0.0", features = ["derive"] }
thiserror = "2.0.18"                                      # error handling
